<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week-end Organisation 🏕️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10 font-sans">

    <header class="max-w-md mx-auto text-center py-10 px-4">
        <h1 class="text-4xl font-black text-slate-900 tracking-tight italic">LE WEEK-END 🍻</h1>
        <p class="text-slate-500 mt-2 font-medium">Gestion des présences et victuailles</p>
    </header>

    <main class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-8 border border-white">
        <form id="mainForm" class="space-y-8">
            
            <!-- NOM -->
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Ton Nom</label>
                <input type="text" id="nom" required class="w-full rounded-2xl border-slate-100 bg-slate-50 p-4 outline-blue-500 border-2 transition-all focus:bg-white">
            </div>

            <!-- PRÉSENCE -->
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Ta présence</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer border-2 border-transparent has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 transition-all">
                        <input type="checkbox" name="jours" value="Jeudi" class="w-5 h-5 rounded text-blue-600">
                        <span class="ml-3 font-bold text-slate-700">Jeudi</span>
                    </label>
                    <label class="flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer border-2 border-transparent has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 transition-all">
                        <input type="checkbox" name="jours" value="Vendredi" class="w-5 h-5 rounded text-blue-600">
                        <span class="ml-3 font-bold text-slate-700">Vendredi</span>
                    </label>
                    <label class="flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer border-2 border-transparent has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 transition-all">
                        <input type="checkbox" name="jours" value="Samedi" class="w-5 h-5 rounded text-blue-600">
                        <span class="ml-3 font-bold text-slate-700">Samedi</span>
                    </label>
                    <label class="flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer border-2 border-transparent has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 transition-all">
                        <input type="checkbox" name="jours" value="Dimanche" class="w-5 h-5 rounded text-blue-600">
                        <span class="ml-3 font-bold text-slate-700">Dimanche</span>
                    </label>
                </div>
            </div>

            <!-- BOISSONS -->
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-4">L'Apéro</label>
                <div class="grid grid-cols-1 gap-2">
                    <label class="flex items-center px-4 py-2"><input type="checkbox" name="boissons" value="Bière" class="w-5 h-5 text-orange-500 rounded-full"> <span class="ml-3 font-medium">Pack de Bières 🍺</span></label>
                    <label class="flex items-center px-4 py-2"><input type="checkbox" name="boissons" value="Captain" class="w-5 h-5 text-red-600 rounded-full"> <span class="ml-3 font-medium">Captain Morgan 🏴‍☠️</span></label>
                    <label class="flex items-center px-4 py-2"><input type="checkbox" name="boissons" value="Get27" class="w-4 h-4 text-green-600 rounded-full"> <span class="ml-3 font-medium">Get 27 🍃</span></label>
                    <input type="text" id="autre_apport" placeholder="Autre chose ? (Pain, sel, charbon...)" class="mt-2 w-full rounded-2xl border-slate-100 bg-slate-50 p-4 border-2 outline-blue-500">
                </div>
            </div>

            <!-- PÊCHE -->
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Côté Pêche 🎣</label>
                <select id="peche" class="w-full rounded-2xl border-slate-100 bg-slate-50 p-4 border-2 font-bold text-slate-700 outline-blue-500 appearance-none">
                    <option value="Aucune">Je ne pêche pas</option>
                    <option value="Carpe">Carpe 🌽</option>
                    <option value="Friture">Friture 🐟</option>
                    <option value="Carnassier">Carnassier 🐊</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] hover:bg-slate-900 transition-all shadow-xl active:scale-95">
                VALIDER MES CHOIX
            </button>
        </form>
    </main>

    <!-- LISTE -->
    <section class="max-w-md mx-auto mt-12 px-6">
        <h2 class="text-2xl font-black text-slate-900 mb-6 flex items-center">
            <span class="w-3 h-3 bg-green-500 rounded-full mr-3 animate-pulse"></span>
            LES INSCRITS
        </h2>
        <div id="listeParticipants" class="space-y-6 text-center py-10 text-slate-400 font-medium">
            Chargement de la liste...
        </div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXK08dPGUvPBdNg6-Vfg27uc6lPy8g5zMRY6Isn0C72T0_tW6rsorRycWupDNwd1BPtQ/exec";
        
        // Gestion de l'ID unique
        let userId = localStorage.getItem('weekend_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('weekend_user_id', userId);
        }

        async function loadParticipants() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                const container = document.getElementById('listeParticipants');
                
                // Pré-remplissage si l'ID existe
                const userFound = data.find(p => p[5] === userId);
                if (userFound) {
                    document.getElementById('submitBtn').innerText = "MODIFIER MES CHOIX";
                    document.getElementById('nom').value = userFound[0];
                    document.getElementById('autre_apport').value = userFound[3];
                    document.getElementById('peche').value = userFound[4];
                    // Cocher les cases
                    userFound[1].split(',').forEach(j => {
                        let cb = document.querySelector(`input[name="jours"][value="${j.trim()}"]`);
                        if(cb) cb.checked = true;
                    });
                    userFound[2].split(',').forEach(b => {
                        let cb = document.querySelector(`input[name="boissons"][value="${b.trim()}"]`);
                        if(cb) cb.checked = true;
                    });
                }

                if(data.length === 0) {
                    container.innerHTML = "Personne pour l'instant...";
                    return;
                }

                container.innerHTML = data.map(p => `
                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-left">
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-black text-slate-900 text-lg">${p[0]}</span>
                            <span class="bg-slate-100 text-slate-500 text-[10px] px-3 py-1 rounded-full font-black uppercase tracking-tighter">${p[4]}</span>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${p[1].split(',').filter(j => j).map(j => `<span class="bg-blue-600 text-white text-[10px] font-black px-3 py-1 rounded-lg uppercase italic">${j.trim()}</span>`).join('')}
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-1">Logistique :</p>
                            <p class="text-sm font-bold text-slate-700">
                                ${p[2] ? `🍺 <span class="text-blue-600 mr-2">${p[2]}</span>` : ''}
                                ${p[3] ? `<span class="block mt-1 text-slate-500 italic">+ ${p[3]}</span>` : ''}
                                ${!p[2] && !p[3] ? 'Pas d\'apport spécifié' : ''}
                            </p>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            btn.disabled = true; btn.innerText = "ENVOI EN COURS...";

            const payload = {
                userId: userId,
                nom: document.getElementById('nom').value,
                presence: Array.from(document.querySelectorAll('input[name="jours"]:checked')).map(el => el.value).join(', '),
                boissons: Array.from(document.querySelectorAll('input[name="boissons"]:checked')).map(el => el.value).join(', '),
                autre: document.getElementById('autre_apport').value,
                peche: document.getElementById('peche').value
            };

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                location.reload();
            } catch (err) {
                alert("Erreur lors de l'envoi. Réessaie !");
                btn.disabled = false; btn.innerText = originalText;
            }
        });

        loadParticipants();
    </script>
</body>
</html>
