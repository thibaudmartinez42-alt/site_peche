<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organisation Week-end 🏕️</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-10">

    <header class="max-w-md mx-auto text-center py-8 px-4">
        <h1 class="text-3xl font-extrabold text-slate-900 italic">LE WEEK-END 🍻</h1>
        <p class="text-slate-600 mt-2">Remplis ça proprement, on compte sur toi !</p>
    </header>

    <main class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-6 border border-slate-200">
        <form id="mainForm" class="space-y-6">
            
            <!-- NOM -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wide">Ton Nom / Pseudo</label>
                <input type="text" id="nom" required class="mt-2 block w-full rounded-xl border-slate-200 bg-slate-50 p-3 outline-blue-500 border shadow-sm">
            </div>

            <!-- PRÉSENCE -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">Ta présence</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex items-center p-3 bg-white border rounded-xl cursor-pointer hover:bg-blue-50 transition">
                        <input type="checkbox" name="jours" value="Jeudi" class="w-5 h-5 text-blue-600 rounded">
                        <span class="ml-3 text-sm font-medium">Jeudi</span>
                    </label>
                    <label class="flex items-center p-3 bg-white border rounded-xl cursor-pointer hover:bg-blue-50 transition">
                        <input type="checkbox" name="jours" value="Vendredi" class="w-5 h-5 text-blue-600 rounded">
                        <span class="ml-3 text-sm font-medium">Vendredi</span>
                    </label>
                    <label class="flex items-center p-3 bg-white border rounded-xl cursor-pointer hover:bg-blue-50 transition">
                        <input type="checkbox" name="jours" value="Samedi" class="w-5 h-5 text-blue-600 rounded">
                        <span class="ml-3 text-sm font-medium">Samedi</span>
                    </label>
                    <label class="flex items-center p-3 bg-white border rounded-xl cursor-pointer hover:bg-blue-50 transition">
                        <input type="checkbox" name="jours" value="Dimanche" class="w-5 h-5 text-blue-600 rounded">
                        <span class="ml-3 text-sm font-medium">Dimanche</span>
                    </label>
                </div>
            </div>

            <!-- BOISSONS -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">Ce que tu ramènes (Boissons)</label>
                <div class="space-y-2">
                    <label class="flex items-center p-2"><input type="checkbox" name="boissons" value="Bière" class="w-4 h-4 text-orange-500"> <span class="ml-3">Pack de Bières 🍺</span></label>
                    <label class="flex items-center p-2"><input type="checkbox" name="boissons" value="Captain" class="w-4 h-4 text-red-600"> <span class="ml-3">Captain Morgan 🏴‍☠️</span></label>
                    <label class="flex items-center p-2"><input type="checkbox" name="boissons" value="Get27" class="w-4 h-4 text-green-600"> <span class="ml-3">Get 27 🍃</span></label>
                    <input type="text" id="autre_apport" placeholder="Autre chose ? (Bouffe, autre alcool...)" class="mt-1 block w-full rounded-xl border-slate-200 bg-slate-50 p-3 border text-sm">
                </div>
            </div>

            <!-- PÊCHE -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">Côté Pêche 🎣</label>
                <select id="peche" class="mt-1 block w-full rounded-xl border-slate-200 bg-slate-50 p-3 border font-medium">
                    <option value="Aucune">Je ne pêche pas</option>
                    <option value="Carpe">Carpe 🌽</option>
                    <option value="Friture">Friture 🐟</option>
                    <option value="Carnassier">Carnassier 🐊</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-blue-600 transition-all shadow-lg transform active:scale-95">
                VALIDER MON INSCRIPTION
            </button>
        </form>
    </main>

    <!-- LISTE DES POTES -->
    <section class="max-w-md mx-auto mt-10 px-4">
        <h2 class="text-2xl font-black text-slate-800 mb-6 flex items-center">
            <span class="bg-blue-600 text-white px-3 py-1 rounded-lg mr-3 text-sm">LIVE</span> 
            LES INSCRITS
        </h2>
        <div id="listeParticipants" class="space-y-4">
            <!-- Injecté par JS -->
        </div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvD8JRvG_y3SYq2f1Xi4XWbVYn_phlwdyenv8ii4uLVxQukr969TaeUpsTAaEnffBj3A/exec";

        async function loadParticipants() {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            const container = document.getElementById('listeParticipants');
            // ... (garder le début du script identique jusqu'à container.innerHTML)

        container.innerHTML = data.map(p => {
            const boissons = p[2] ? p[2].split(',').map(b => `<span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded text-[10px] font-bold">${b.trim()}</span>`).join(' ') : '';
            const autre = p[3] ? `<div class="mt-2 text-sm p-2 bg-slate-50 rounded-lg border-l-4 border-blue-500 text-slate-700"><strong>Aussi :</strong> ${p[3]}</div>` : '';
        
            return `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center border-b pb-2 mb-2">
                        <span class="font-bold text-slate-900">${p[0]}</span>
                        <span class="text-[10px] font-bold text-blue-500 uppercase">${p[4]}</span>
                    </div>
                    <div class="flex flex-wrap gap-1 mb-3">
                        ${p[1].split(',').map(j => `<span class="bg-blue-600 text-white px-2 py-0.5 rounded text-[10px]">${j.trim()}</span>`).join('')}
                    </div>
                    <div class="space-y-1">
                        ${boissons}
                        ${autre}
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('mainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "Enregistrement...";

            const payload = {
                nom: document.getElementById('nom').value,
                presence: Array.from(document.querySelectorAll('input[name="jours"]:checked')).map(el => el.value).join(', '),
                boissons: Array.from(document.querySelectorAll('input[name="boissons"]:checked')).map(el => el.value).join(', '),
                autre: document.getElementById('autre_apport').value,
                peche: document.getElementById('peche').value
            };

            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            location.reload();
        });

        loadParticipants();
    </script>
</body>
</html>
